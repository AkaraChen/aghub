    zh-Hant: "修正 macOS 上一開啟技能頁面應用程式就結束的問題，並更新相依套件。"
highlights:
    - id: skill-audit-macos
      icon: shield
      category: fix
      title:
          en: "Skills page no longer quits on macOS"
          zh-Hans: "macOS 技能页面不再闪退"
          zh-Hant: "macOS 技能頁面不再閃退"
      description:
          en: "The signed macOS app now carries the system permission the Skill security scan needs, so scanning installed Skills no longer terminates the app."
          zh-Hans: "macOS 签名版补上 Skill 安全扫描所需的系统权限，扫描已安装的 Skill 时不再导致应用被系统终止。"
          zh-Hant: "macOS 簽署版補上 Skill 安全掃描所需的系統權限，掃描已安裝的 Skill 時不再導致應用程式被系統終止。"
