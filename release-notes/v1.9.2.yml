version: 1.9.2
channel: stable
title:
    en: "Skills page crash fix"
    zh-Hans: "修复技能页面闪退"
    zh-Hant: "修正技能頁面閃退"
announcement:
    en: "1.9.2 is a fix release for 1.9.1. The rebuilt next version is still being designed."
    zh-Hans: "1.9.2 是 1.9.1 的修复版本，全新重构的下一版本仍在设计中。"
