          zh-Hans: "依赖更新"
          zh-Hant: "相依套件更新"
      description:
          en: "Update HeroUI, Tauri plugins, reqwest, serde_json, and other dependencies."
          zh-Hans: "更新 HeroUI、Tauri 插件、reqwest、serde_json 等依赖。"
          zh-Hant: "更新 HeroUI、Tauri 外掛、reqwest、serde_json 等相依套件。"
