[workspace]
members = [
	"crates/agents",
	"crates/core",
	"crates/cli",
	"crates/api",
	"crates/skills-sh",
	"crates/skill",
	"crates/git",
	"crates/json",
	"crates/markdown",
	"crates/inference",
	"crates/cc-plugins",
	"crates/usage",
	"crates/desktop/src-tauri",
]
resolver = "2"

[workspace.package]
version = "1.1.1"
edition = "2021"
authors = [ "Eric Qu <akarachen>" ]
license = "MIT"
repository = "https://github.com/akarachen/aghub"

[workspace.dependencies]
# Core dependencies
serde = { version = "1.0", features = [ "derive" ] }
serde_json = { version = "1.0", features = [ "preserve_order" ] }
jsonc-parser = { version = "0.32.4", features = [
	"cst",
	"serde",
	"serde_json",
] }
thiserror = "2.0"
dirs = "6.0"
libc = "0.2"
ts-rs = "12.0.1"

# CLI dependencies
clap = { version = "4.5", features = [ "derive" ] }
tabled = "0.20"
anyhow = "1.0"
colored = "3.0"

# HTTP dependencies
reqwest = { version = "0.13", features = [ "json" ] }
url = "2.5"

# Testing dependencies
tempfile = "3.10"
assert_cmd = "2.2"
predicates = "3.1"

# YAML parsing
serde_yaml = "0.9"

# TOML parsing
toml = "1.0"
toml_edit = "0.25"

# Interactive CLI
inquire = "0.9"

# Git hooks
cargo-husky = { version = "1", default-features = false, features = [
	"precommit-hooks",
	"run-cargo-test",
] }
