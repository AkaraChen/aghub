name: CI

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

env:
    CARGO_TERM_COLOR: always

jobs:
    check:
        name: Check (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        env:
            SCCACHE_GHA_ENABLED: "true"
            RUSTC_WRAPPER: "sccache"
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
        steps:
            - uses: actions/checkout@v7

            - name: Install System Dependencies (Linux)
              if: matrix.os == 'ubuntu-latest'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy, rustfmt

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "24"

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install @antfu/ni
              run: bun i -g @antfu/ni

            - name: Install just
              uses: taiki-e/install-action@v2.85.4
              with:
                  tool: just

            - name: Setup sccache
              uses: mozilla-actions/sccache-action@v0.0.10

            - name: Rust Cache
              uses: Swatinem/rust-cache@v2

            - name: Cargo Fetch
              run: cargo fetch

            - name: Install frontend dependencies
              run: cd crates/desktop && bun install --frozen-lockfile

            - name: Install root dependencies
              run: bun install

            - name: Format Check
              run: |
                  cargo fmt --all -- --check
                  bun run format:check
                  git diff --exit-code

            - name: Lint
              run: just lint

            - name: Test
              run: just test

            - name: Test desktop release notes
              if: matrix.os == 'ubuntu-latest'
              working-directory: crates/desktop
              run: |
                  bun run release-notes:check
                  bun run test:unit
                  bun run test:release-notes

            - name: Build
              run: |
                  just build
                  cd crates/desktop && bun run build

    e2e:
        name: Desktop E2E
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install frontend dependencies
              run: cd crates/desktop && bun install

            - name: Install Playwright browsers
              run: cd crates/desktop && bunx playwright install --with-deps chromium

            - name: Run E2E tests
              run: cd crates/desktop && bun run test:e2e

            - name: Upload Playwright report
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-report
                  path: crates/desktop/playwright-report/
                  retention-days: 7
