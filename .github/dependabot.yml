version: 2
updates:
    - package-ecosystem: "cargo"
      directory: "/"
      schedule:
          interval: "weekly"

    - package-ecosystem: "bun"
      directory: "/"
      schedule:
          interval: "weekly"

    - package-ecosystem: "bun"
      directory: "/crates/desktop"
      schedule:
          interval: "weekly"
      # Keep @heroui/react and @heroui/styles in lockstep: react bundles a pinned
      # @heroui/styles, so bumping either alone skews the JS-emitted classes vs the
      # loaded CSS. Group them so every heroui bump moves both packages together.
      groups:
          heroui:
              patterns:
                  - "@heroui/*"

    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "weekly"
