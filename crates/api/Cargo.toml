[package]
name = "aghub-api"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "REST API server for aghub"

[[bin]]
name = "aghub-api"
path = "src/main.rs"

[lib]
name = "aghub_api"
path = "src/lib.rs"
crate-type = [ "rlib" ]

[dependencies]
aghub-core = { path = "../core" }
aghub-git = { path = "../git" }
aghub-inference = { path = "../inference" }
aghub-cc-plugins = { path = "../cc-plugins" }
skill = { path = "../skill" }
skills-sh = { path = "../skills-sh" }
rocket = { version = "0.5", features = [ "json" ] }
rocket_cors = "0.6.0"
tokio = { workspace = true, features = [ "rt-multi-thread", "macros", "process" ] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
dirs = { workspace = true }
ts-rs = { workspace = true }
which = { workspace = true }
open = "5"
tempfile = { workspace = true }
keyring = { workspace = true }
uuid = { workspace = true }
log = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }
