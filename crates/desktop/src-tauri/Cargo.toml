[package]
name = "aghub"
description = "A Tauri App"
authors = [ "you" ]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "aghub_desktop_lib"
crate-type = [ "staticlib", "cdylib", "rlib" ]

[build-dependencies]
dotenvy = "0.15.7"
tauri-build = { version = "2", features = [  ] }
ureq = "3"
flate2 = "1.0"
tar = "0.4"
serde_json = "1"
sha2 = "0.11"
base64 = "0.23"

[dependencies]
tauri = { workspace = true, features = [ "tray-icon" ] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2.4.7"
tauri-plugin-store = "2"
tauri-plugin-single-instance = { version = "2.4.0", features = [ "deep-link" ] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-log = { version = "2.8.0", features = [ "colored" ] }
serde = { workspace = true }
serde_json = { workspace = true }
aghub-api = { path = "../../api" }
aghub-core = { path = "../../core" }
tokio = { workspace = true, features = [ "process", "rt", "time" ] }
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs", rev = "c4c45d503ea115a839aae718d02f79e7c7f0f673" }
log = { workspace = true }
time = { version = "0.3", features = [ "formatting", "local-offset" ] }
zip = { version = "8", default-features = false, features = [ "deflate" ] }
posthog-rs = "0.23.0"
uuid = { workspace = true }
tauri-plugin-autostart = "2.5.1"
sys-locale = "0.3.2"
reqwest = { workspace = true }
semver = "1.0.28"
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
