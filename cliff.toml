[changelog]
header = """
# Changelog\n
All notable changes to this project will be documented in this file.\n
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\

{% for group, commits in commits | group_by(attribute="group") %}
<details open><summary><strong>{{ group | upper_first }}</strong></summary>

{% for commit in commits %}\
- {% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message | upper_first }} ([{{ commit.id | truncate(length=8, end="") }}](https://github.com/AkaraChen/aghub/commit/{{ commit.id | truncate(length=8, end="") }}))
{% endfor %}
</details>
{% endfor %}
"""
trim = true
footer = """
<!-- generated by git-cliff -->
"""

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_preprocessors = []
commit_parsers = [
	{ message = "^feat", group = "Features" },
	{ message = "^fix", group = "Bug Fixes" },
	{ message = "^perf", group = "Performance" },
	{ message = "^refactor", group = "Refactor" },
	{ message = "^docs", group = "Documentation" },
	{ message = "^style", group = "Styling" },
	{ message = "^test", group = "Testing" },
	{ message = '^chore\(deps', group = "Dependencies" },
	{ message = "^chore", group = "Miscellaneous Tasks" },
	{ message = ".*", group = "Other Changes" },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
skip_tags = ""
ignore_tags = ""
sort_commits = "oldest"
